name: wan-ingress

# The fuzzing cadence from the originating ticket (lab-safety#38): a 30s smoke
# per target on every PR, ten minutes per target nightly, and a static build for
# both OSes and arches.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"

jobs:
  smoke:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: The border's freshness contract
        run: python3 -m unittest discover -s harness -p '*_test.py' -v
      - name: The shipped example refuses to start
        shell: bash
        run: |
          go build -o /tmp/wan-ingress ./cmd/wan-ingress
          if /tmp/wan-ingress -check-config -config configs/wan-ingress.example.json; then
            echo "the example config started; a placeholder is a published credential" >&2
            exit 1
          fi
      - name: Fuzz smoke — 30s per target
        shell: bash
        run: |
          for target in FuzzResolveName FuzzQuarantineContract FuzzBorderForward FuzzCanonicalize FuzzConfig; do
            go test ./internal/ingress -run='^$' -fuzz="^${target}$" -fuzztime=30s
          done

  cross-build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./scripts/build-wan-ingress.sh

  docker:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate hardened Compose stack
        run: docker compose config --quiet
      - name: Build the hardened image
        run: docker build --target wan-ingress -t wan-ingress/wan-ingress:ci .

  nightly-fuzz:
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fuzz — 10m per target
        shell: bash
        run: |
          for target in FuzzResolveName FuzzQuarantineContract FuzzBorderForward FuzzCanonicalize FuzzConfig; do
            go test ./internal/ingress -run='^$' -fuzz="^${target}$" -fuzztime=10m
          done
